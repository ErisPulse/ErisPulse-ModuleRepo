name: 📦 处理模块提交

permissions:
  contents: write

on:
  repository_dispatch:
    types: [submit_module]

jobs:
  process-submission:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: 获取 bot 用户 ID
        id: bot-info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          echo "bot-user-id=$BOT_USER_ID" >> $GITHUB_OUTPUT

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: 2x
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 处理提交数据
        id: process
        env:
          SUBMISSION_DATA: ${{ toJson(github.event.client_payload) }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: python .github/scripts/handle_submission.py

      - name: 提交更改
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_USER_ID: ${{ steps.bot-info.outputs.bot-user-id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --unset-all http.https://github.com/.extraheader || true
          git add packages.json
          git diff --cached --quiet || git commit -m "📦 新模块提交: ${{ steps.process.outputs.module_name }} [skip ci]

          新模块提交（未验证）
          提交者: ${{ github.event.client_payload.submitted_by }}
          类型: ${{ github.event.client_payload.type }}
          包名: ${{ github.event.client_payload.package }}"
          # 竞态处理：auto-update / 管理操作 / API 直改可能同时推进 2x，
          # push 前先 rebase 到最新；packages.json 真冲突则显式报错，远端再次前进则重试
          pushed=0
          for i in 1 2 3; do
            git fetch origin 2x
            if ! git rebase origin/2x; then
              git rebase --abort
              echo "::error::packages.json 与远端冲突，无法自动合并，请手动处理"
              exit 1
            fi
            if git push origin HEAD:2x; then pushed=1; break; fi
            echo "远端在推送前再次更新，重新 rebase（第 $i 次）"
          done
          [ "$pushed" = "1" ] || { echo "::error::推送重试耗尽，远端持续更新中"; exit 1; }

      - name: 处理失败通知
        if: failure()
        run: |
          echo "❌ 模块提交处理失败"
          echo "提交数据: ${{ toJson(github.event.client_payload) }}"
